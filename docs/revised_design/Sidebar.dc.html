<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Gabarito:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit;text-decoration:none}a:hover{color:inherit}</style>
</helmet>
<aside style="width:232px;flex:0 0 232px;display:flex;flex-direction:column;gap:0;padding:18px 14px;background:var(--plane);box-shadow:inset -1px 0 0 var(--divider);font-family:var(--font-ui);color:var(--ink);min-height:100%;box-sizing:border-box">
  <a href="#" style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px">
    <span aria-hidden="true" style="display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,var(--raised-lit),var(--raised));box-shadow:var(--ring),var(--light-top);font-family:var(--font-mono);font-size:15px;color:var(--accent)">[·]</span>
    <span style="font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-0.01em">Interview trainer</span>
  </a>
  <div style="height:0;border-top:var(--divider-dashed);margin:0 6px 14px"></div>
  <div style="font-size:var(--text-eyebrow);letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:var(--ink-3);padding:0 10px 8px">Practice</div>
  <nav aria-label="Primary" style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ practice }}" as="it" hint-placeholder-count="3">
      <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:var(--radius-control);font-size:var(--text-body);font-weight:500;color:{{ it.color }};background:{{ it.bg }};box-shadow:{{ it.shadow }}" style-hover="background:var(--hover)">
        <span style="display:grid;place-items:center;width:20px;height:20px;color:{{ it.iconColor }}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.path }}"></path></svg></span>
        <span>{{ it.label }}</span>
        <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);background:var(--recess);box-shadow:var(--shadow-recess);border-radius:5px;padding:1px 6px">{{ it.badge }}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="font-size:var(--text-eyebrow);letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:var(--ink-3);padding:22px 10px 8px">You</div>
  <nav aria-label="Account" style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ account }}" as="it" hint-placeholder-count="2">
      <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:var(--radius-control);font-size:var(--text-body);font-weight:500;color:{{ it.color }};background:{{ it.bg }};box-shadow:{{ it.shadow }}" style-hover="background:var(--hover)">
        <span style="display:grid;place-items:center;width:20px;height:20px;color:{{ it.iconColor }}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.path }}"></path></svg></span>
        <span>{{ it.label }}</span>
      </a>
    </sc-for>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-card);background:var(--recess);box-shadow:var(--shadow-recess)">
      <span style="display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,var(--raised-lit),var(--raised));box-shadow:var(--ring),var(--light-top);font-size:12px;font-weight:600;color:var(--ink)">A</span>
      <span style="display:flex;flex-direction:column;min-width:0"><span style="font-size:13px;font-weight:500">Alex</span><span style="font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Demo profile · Python</span></span>
    </div>
    <span style="font-size:11px;color:var(--ink-3);padding:0 10px;line-height:1.5">Fictional sessions. Nothing here measures mastery.</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:720},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;roadmap&quot;,&quot;sessions&quot;,&quot;profile&quot;,&quot;preferences&quot;,&quot;system&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'home';
    const paths = {
      home: 'M10 5C7 3 4 3 2 4v12c3-1 5-1 8 1 3-2 5-2 8-1V4c-2-1-5-1-8 1Zm0 0v12',
      roadmap: 'M2 8h5v5H2zM13 3h5v5h-5zM13 12h5v5h-5zM7 10h3V5.5h3M10 10v4.5h3',
      sessions: 'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm0 3v4l3 2',
      profile: 'M10 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-6 7c0-3 3-5 6-5s6 2 6 5',
      preferences: 'M3 5h14M3 15h14M9 5a2 2 0 1 0-4 0 2 2 0 0 0 4 0Zm6 10a2 2 0 1 0-4 0 2 2 0 0 0 4 0Z',
      system: 'M4 4h12v12H4zM4 9h12M9 9v7',
    };
    const mk = (id, label, badge) => {
      const current = id === cur;
      return { href: `#${id}`, label, badge: badge ?? false, path: paths[id], current: current ? 'page' : undefined,
        color: current ? 'var(--ink)' : 'var(--ink-2)', iconColor: current ? 'var(--accent)' : 'var(--ink-3)',
        bg: current ? 'linear-gradient(180deg,var(--raised-lit),var(--raised))' : 'transparent',
        shadow: current ? 'var(--ring), var(--light-top), var(--shadow-contact)' : 'none' };
    };
    return {
      practice: [mk('home', 'Home'), mk('roadmap', 'Roadmap'), mk('sessions', 'Sessions', '3')],
      account: [mk('profile', 'Profile'), mk('preferences', 'Preferences'), mk('system', 'Design system')],
    };
  }
}
</script>
</body>
</html>
